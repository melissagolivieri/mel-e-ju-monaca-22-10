<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Cadastro</title>
</head>
<body data-pagina="cadastro">
  <div class="caixa">
    <h1>Criar conta</h1>

    <form id="form-cadastro" novalidate>
      <p class="alerta" role="alert"></p>

      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name">
        <small class="erro"></small>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <small class="erro"></small>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-wrap">
          <input id="senha" name="senha" type="password" autocomplete="new-password">
          <button type="button" class="ver-senha" aria-pressed="false">Mostrar</button>
        </div>
        <div class="forca"><span></span></div>
        <small class="forca-texto" aria-live="polite"></small>
        <small class="erro"></small>
      </div>

      <button type="submit" class="botao">Cadastrar</button>
    </form>

    <p class="link">Já tem conta? <a href="index.html">Entrar</a></p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
