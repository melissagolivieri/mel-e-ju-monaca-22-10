<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Login</title>
</head>
<body data-pagina="login">
  <div class="caixa">
    <h1>Entrar</h1>

    <form id="form-login" novalidate>
      <p class="alerta" role="alert"></p>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <small class="erro"></small>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha-wrap">
          <input id="senha" name="senha" type="password" autocomplete="current-password">
          <button type="button" class="ver-senha" aria-pressed="false">Mostrar</button>
        </div>
        <small class="erro"></small>
      </div>

      <button type="submit" class="botao">Entrar</button>
    </form>

    <p class="link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
